<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>miumiuiuem – Học Ngoại ngữ Song hành & Luyện thi VSTEP</title>
    <link rel="icon" type="image/webp" href="./BO.webp" />
    <link rel="apple-touch-icon" href="./BO.webp" />
    <meta
      name="description"
      content="miumiuiuem - Nền tảng học tiếng Anh & luyện thi VSTEP 4 kỹ năng kết hợp trợ lý AI Gemini."
    />
    <meta
      name="keywords"
      content="VSTEP, học tiếng Anh, luyện thi VSTEP, AI tutor"
    />
    <meta
      property="og:title"
      content="miumiuiuem – Học tiếng Anh & Luyện thi VSTEP"
    />
    <meta
      property="og:description"
      content="miumiuiuem - Nền tảng học tiếng Anh với AI Gemini hỗ trợ dịch thuật và chấm điểm VSTEP."
    />
    <meta name="theme-color" content="#6366f1" />

    <!-- ==================================================================
         0. BOOT (must run before the stylesheets are parsed)
         ================================================================== -->
    <!-- Restore the saved theme before CSS loads: prevents a flash of the
         wrong colour scheme. Render blocking on purpose, keep it tiny. -->
    <script src="./js/theme-boot.js"></script>
    <!-- PWA: injects ./manifest.json and registers ./sw.js (HTTP(S) only). -->
    <script src="./js/pwa.js"></script>

    <!-- ==================================================================
         1. FONTS
         ================================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Noto+Serif:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ==================================================================
         2. STYLESHEETS - ORDER IS THE CASCADE (CRITICAL - DO NOT REORDER)
         css/critical.css  : boot preloader only (tiny, paints first)
         css/00 … css/14   : split from the old single style.css, in the exact
                             order the rules used to appear. Reordering these
                             <link> tags changes the cascade and WILL break
                             the design system.
         ================================================================== -->
    <link rel="stylesheet" href="./css/critical.css" />
    <link rel="stylesheet" href="./css/00-prelude.css" />
    <link rel="stylesheet" href="./css/01-tokens.css" />
    <link rel="stylesheet" href="./css/02-base.css" />
    <link rel="stylesheet" href="./css/03-navigation.css" />
    <link rel="stylesheet" href="./css/04-dashboard.css" />
    <link rel="stylesheet" href="./css/05-learn.css" />
    <link rel="stylesheet" href="./css/06-vstep.css" />
    <link rel="stylesheet" href="./css/07-widgets.css" />
    <link rel="stylesheet" href="./css/08-responsive.css" />
    <link rel="stylesheet" href="./css/09-roadmap.css" />
    <link rel="stylesheet" href="./css/10-lesson-content.css" />
    <link rel="stylesheet" href="./css/11-overrides.css" />
    <link rel="stylesheet" href="./css/12-mobile.css" />
    <link rel="stylesheet" href="./css/13-views-tidy.css" />
    <link rel="stylesheet" href="./css/14-thithu.css" />

    <!-- ==================================================================
         3. APPLICATION SCRIPTS - ORDER IS THE DEPENDENCY GRAPH
         (CRITICAL - DO NOT REORDER)
           1. Data        : vocabulary, grammar, vstep, aiResponses, lessons
           2. Services    : gemini, StorageManager, wordSaver, ...
           3. Core        : app.js (state manager + router)
           4. Utils       : PracticeTestValidator
           5. Components  : Navbar, AISidebar, ClockBubble, NotesBubble, Translator
           6. Views       : Dashboard, Learn, Roadmap, VstepPrep, Thithu, Settings, Notes
           7. Boot        : validate-tests.js (runs on window "load")
         ================================================================== -->

    <!-- 1. Data -->
    <script src="./src/data/vocabulary.js"></script>
    <script src="./src/data/grammar.js"></script>
    <script src="./src/data/vstepMock.js"></script>
    <script src="./src/data/vstepListeningData.js"></script>
    <script src="./src/data/vstepReadingData.js"></script>
    <script src="./src/data/vstepSpeakingData.js"></script>
    <script src="./src/data/vstepWritingData.js"></script>
    <script src="./src/data/vstepEssayVocab.js"></script>
    <script src="./src/data/vstepVocab.js"></script>
    <script src="./src/data/aiResponses.js"></script>
    <script src="./src/data/vstepEssayBookData.js"></script>
    <script src="./src/data/vstepIdeaData.js"></script>
    <script src="./src/data/practiceTests.js"></script>
    <script src="./src/data/vstepWritingTests31.js"></script>
    <script src="./src/data/lessons/lesson1.js"></script>
    <script src="./src/data/lessons/lesson2.js"></script>
    <script src="./src/data/lessons/lesson3.js"></script>
    <script src="./src/data/lessons/lesson4.js"></script>
    <script src="./src/data/lessons/lesson5.js"></script>
    <script src="./src/data/lessons/lesson6.js"></script>
    <script src="./src/data/lessons/lesson7.js"></script>
    <script src="./src/data/lessons/lesson8.js"></script>
    <script src="./src/data/lessons/lesson9.js"></script>
    <script src="./src/data/lessons/lesson10.js"></script>
    <script src="./src/data/lessons/lesson11.js"></script>
    <script src="./src/data/lessons/lesson12.js"></script>
    <script src="./src/data/lessons/lesson13.js"></script>
    <script src="./src/data/lessons/lesson14.js"></script>
    <script src="./src/data/lessons/lesson15.js"></script>

    <!-- 2. Services -->
    <script src="./src/services/gemini.js"></script>
    <script src="./src/services/StorageManager.js"></script>
    <!-- SoundManager must load before app.js and Settings.js. -->
    <script src="./src/services/SoundManager.js"></script>
    <!-- Drive audio service is used by VSTEP listening views. -->
    <script src="./src/services/driveAudio.js"></script>
    <script src="./src/services/AudioStorage.js"></script>
    <script src="./src/services/cloudinaryAudio.js"></script>
    <script src="./src/services/GradingService.js"></script>
    <script src="./src/services/wordSaver.js"></script>
    <script src="./src/services/KeyboardManager.js"></script>
    <script src="./src/services/NoteDragDrop.js"></script>

    <!-- 3. App core -->
    <script src="./src/app.js"></script>

    <!-- 4. Utils -->
    <script src="./src/utils/PracticeTestValidator.js"></script>

    <!-- 5. Components -->
    <script src="./src/components/Navbar.js"></script>
    <script src="./src/components/AISidebar.js"></script>
    <script src="./src/components/ClockBubble.js"></script>
    <script src="./src/components/NotesBubble.js"></script>
    <script src="./src/components/Translator.js"></script>

    <!-- 6. Views -->
    <script src="./src/views/Dashboard.js"></script>
    <script src="./src/views/Learn.js"></script>
    <script src="./src/views/Roadmap.js"></script>
    <script src="./src/views/VstepPrep.js"></script>
    <script src="./src/views/ThithuView.js?v=10"></script>
    <script src="./src/views/Settings.js"></script>
    <script src="./src/views/Notes.js"></script>

    <!-- 7. Boot extras -->
    <script src="./js/validate-tests.js"></script>
  </head>

  <body>
    <!-- ==================================================================
         APP PRELOADER - removed by js/preloader.js once App.init() finishes
         ================================================================== -->
    <div
      id="app-preloader"
      role="status"
      aria-live="polite"
      aria-label="Đang tải ứng dụng miumiuiuem"
    >
      <div class="preloader-langs" aria-hidden="true">🇻🇳 🇬🇧</div>
      <div class="preloader-logo">miumiuiuem</div>
      <div class="preloader-spinner" aria-hidden="true"></div>
      <p class="preloader-text">Đang khởi tạo hệ thống học tập...</p>
    </div>

    <!-- ==================================================================
         APP SHELL - src/app.js (router) injects the active view into
         #main-content, Navbar.js fills <nav>.
         ================================================================== -->
    <div class="app-container" id="app-root">
      <header>
        <nav
          class="navbar"
          id="navbar"
          role="navigation"
          aria-label="Điều hướng chính miumiuiuem"
        >
          <!-- Rendered by Navbar.js -->
        </nav>
      </header>

      <main class="main-content" id="main-content" role="main">
        <!-- Dynamic view content injected here by App.navigate() -->
      </main>
    </div>

    <!-- ==================================================================
         FLOATING WIDGETS
         A hub bubble (+) sits in the bottom-right corner. Hovering (mouse)
         or focusing it fans the three widget bubbles out along a quarter-
         circle arc. Arc open/close lives in src/app.js (initFloatingMenu),
         the panel behaviour in AISidebar / ClockBubble / NotesBubble.
         ================================================================== -->

    <!-- Quick-menu hub (bottom-right corner) -->
    <div id="floating-menu-container" class="floating-menu-container">
      <button
        id="floating-menu-toggle"
        class="floating-menu-toggle"
        aria-label="Menu nhanh"
        aria-expanded="false"
        title="Menu nhanh: Trợ lý BO · Đồng hồ · Ghi chú"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/>
        </svg>
      </button>
    </div>

    <!-- Floating AI Toggle Button -->
    <button
      id="ai-toggle-btn"
      class="ai-toggle-btn pulse"
      aria-label="Mở trợ lý BO"
      title="Mở Trợ lý BO miumiuiuem"
    >
      <!-- SVG injected by AISidebar.render() -->
    </button>

    <!-- AI Popup Compact Panel -->
    <div id="ai-popup" class="floating-panel" role="dialog" aria-label="Trợ lý BO">
      <!-- Rendered by AISidebar.render() -->
    </div>

    <!-- Floating Clock Toggle Button -->
    <button
      id="clock-toggle-btn"
      class="clock-toggle-btn"
      aria-label="Đồng hồ"
      title="Đồng hồ"
    >
      <!-- SVG injected by ClockBubble.render() -->
    </button>

    <!-- Clock Popup Compact Panel -->
    <div id="clock-popup" class="floating-panel" role="dialog" aria-label="Đồng hồ">
      <!-- Rendered by ClockBubble.render() -->
    </div>

    <!-- Floating Notes Toggle Button -->
    <button
      id="notes-toggle-btn"
      class="notes-toggle-btn"
      aria-label="Ghi chú"
      title="Ghi chú"
    >
      📝
    </button>

    <!-- Notes Popup Compact Panel -->
    <div id="notes-popup" class="floating-panel" role="dialog" aria-label="Ghi chú">
      <!-- Rendered by NotesBubble.render() -->
    </div>

    <!-- ==================================================================
         STARTUP - loaded last, after every application script.
         js/preloader.js : dismissPreloader() + 10s safety net
         js/shell.js     : click wiring for the floating widgets
         ================================================================== -->
    <script src="./js/preloader.js"></script>
    <script src="./js/shell.js"></script>
  </body>
</html>
